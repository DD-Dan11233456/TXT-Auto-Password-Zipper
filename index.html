<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Zipper</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/zip.js/2.7.53/zip.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a90e2;
            --primary-hover: #357abd;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h2 {
            margin: 0 0 10px 0;
            color: #222;
            font-weight: 600;
            text-align: center;
        }

        .text-container {
            position: relative;
            width: 100%;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            font-size: 16px;
            line-height: 1.6;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: none;
            overflow-y: hidden;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: flex-end;
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #666;
        }

        .input-group input {
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            min-height: 41px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        #downloadFallback {
            display: none;
            color: var(--primary-hover);
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Secure Document Notepad</h2>

        <div class="text-container">
            <textarea id="messageBox" placeholder="Start typing your document here... It will automatically expand as you write."></textarea>
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="fileName">Zip File Name</label>
                <input type="text" id="fileName" placeholder="my-secure-file" value="secret_document">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter encryption password">
            </div>

            <button id="zipBtn" type="button">Zip &amp; Encrypt</button>
        </div>

        <a id="downloadFallback" href="#" download>Download the ZIP file</a>
    </div>

    <script>
        const messageBox = document.getElementById('messageBox');
        const fileNameInput = document.getElementById('fileName');
        const passwordInput = document.getElementById('password');
        const zipBtn = document.getElementById('zipBtn');
        const downloadFallback = document.getElementById('downloadFallback');

        // Workers are disabled so this also works when index.html is opened
        // directly from a local file, on Linux, or on Windows.
        if (!window.zip) {
            zipBtn.disabled = true;
            alert('The ZIP library could not be loaded. Check your internet connection and reload the page.');
        } else {
            zip.configure({ useWebWorkers: false });
        }

        messageBox.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        function downloadBlob(blob, fileName) {
            const objectUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = objectUrl;
            link.download = fileName;
            link.rel = 'noopener';
            link.style.display = 'none';
            document.body.appendChild(link);

            // msSaveOrOpenBlob is required by older Windows browsers.
            if (typeof navigator.msSaveOrOpenBlob === 'function') {
                navigator.msSaveOrOpenBlob(blob, fileName);
            } else {
                link.click();
            }

            link.remove();

            // Keep a visible fallback for browsers that block programmatic
            // downloads (and for browsers with download restrictions).
            downloadFallback.href = objectUrl;
            downloadFallback.download = fileName;
            downloadFallback.style.display = 'block';
            downloadFallback.textContent = `If the download did not start, click here to download ${fileName}`;

            // Do not revoke immediately: the fallback link still needs the URL.
            setTimeout(() => {
                URL.revokeObjectURL(objectUrl);
                downloadFallback.removeAttribute('href');
                downloadFallback.style.display = 'none';
            }, 10 * 60 * 1000);
        }

        zipBtn.addEventListener('click', async function () {
            const textContent = messageBox.value;
            let fileName = fileNameInput.value.trim() || 'document';
            const password = passwordInput.value;

            if (!textContent.trim()) {
                alert('Please write some text in the box before zipping.');
                return;
            }

            if (!password) {
                alert('Please enter a password to encrypt your file.');
                return;
            }

            if (fileName.toLowerCase().endsWith('.zip')) {
                fileName = fileName.slice(0, -4);
            }

            // Prevent path traversal and invalid Windows filename characters.
            fileName = fileName.replace(/[\\/:*?"<>|]/g, '_') || 'document';

            zipBtn.disabled = true;
            zipBtn.innerText = 'Encrypting...';
            downloadFallback.style.display = 'none';

            try {
                const blobWriter = new zip.BlobWriter('application/zip');
                const zipWriter = new zip.ZipWriter(blobWriter);

                await zipWriter.add(
                    'document.txt',
                    new zip.TextReader(textContent),
                    { password, zipCrypto: true }
                );

                await zipWriter.close();
                const finalZipBlob = await blobWriter.getData();
                downloadBlob(finalZipBlob, `${fileName}.zip`);
            } catch (error) {
                alert(`An error occurred during encryption: ${error.message || error}`);
                console.error(error);
            } finally {
                zipBtn.disabled = false;
                zipBtn.innerText = 'Zip & Encrypt';
            }
        });
    </script>
</body>
</html>
