<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Zipper</title>
    <style>
        :root { --bg-color:#f4f7f6; --card-bg:#fff; --text-color:#333; --primary-color:#4a90e2; --primary-hover:#357abd; --border-color:#e0e0e0; }
        body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:var(--bg-color); color:var(--text-color); margin:0; padding:40px 20px; display:flex; justify-content:center; align-items:flex-start; min-height:100vh; box-sizing:border-box; }
        .container { width:100%; max-width:800px; background:var(--card-bg); padding:30px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:20px; box-sizing:border-box; }
        h2 { margin:0 0 10px; color:#222; font-weight:600; text-align:center; }
        .text-container { position:relative; width:100%; }
        textarea { width:100%; min-height:150px; padding:15px; font-size:16px; line-height:1.6; border:1px solid var(--border-color); border-radius:8px; resize:none; overflow-y:hidden; box-sizing:border-box; font-family:inherit; }
        textarea:focus { border-color:var(--primary-color); box-shadow:0 0 0 3px rgba(74,144,226,.1); outline:none; }
        .controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; align-items:end; background:#fafafa; padding:20px; border-radius:8px; border:1px solid var(--border-color); }
        .input-group { display:flex; flex-direction:column; gap:8px; }
        .input-group label { font-size:14px; font-weight:600; color:#666; }
        .input-group input { padding:10px 12px; font-size:14px; border:1px solid var(--border-color); border-radius:6px; outline:none; box-sizing:border-box; }
        .input-group input:focus { border-color:var(--primary-color); }
        button { background:var(--primary-color); color:#fff; border:0; padding:12px 20px; font-size:15px; font-weight:600; border-radius:6px; cursor:pointer; min-height:41px; }
        button:hover { background:var(--primary-hover); }
        button:disabled { background:#ccc; cursor:not-allowed; }
        #downloadFallback { display:none; color:var(--primary-hover); font-weight:600; text-align:center; }
        #status { min-height:1.2em; text-align:center; color:#666; font-size:14px; }
    </style>
</head>
<body>
    <main class="container">
        <h2>Secure Document Notepad</h2>
        <div class="text-container">
            <textarea id="messageBox" placeholder="Start typing your document here... It will automatically expand as you write."></textarea>
        </div>
        <div class="controls">
            <div class="input-group">
                <label for="fileName">Zip File Name</label>
                <input type="text" id="fileName" placeholder="my-secure-file" value="secret_document">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter encryption password" autocomplete="new-password">
            </div>
            <button id="zipBtn" type="button" disabled>Zip &amp; Encrypt</button>
        </div>
        <div id="status" role="status" aria-live="polite">Loading ZIP library...</div>
        <a id="downloadFallback" href="#" download>Download the ZIP file</a>
    </main>

    <script>
        'use strict';

        const messageBox = document.getElementById('messageBox');
        const fileNameInput = document.getElementById('fileName');
        const passwordInput = document.getElementById('password');
        const zipBtn = document.getElementById('zipBtn');
        const downloadFallback = document.getElementById('downloadFallback');
        const status = document.getElementById('status');
        let downloadUrl = null;
        let zipReady = false;

        function setStatus(message, isError = false) {
            status.textContent = message;
            status.style.color = isError ? '#b00020' : '#666';
        }

        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = url;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error(`Could not load ${url}`));
                document.head.appendChild(script);
            });
        }

        async function loadZipLibrary() {
            if (window.zip && typeof window.zip.ZipWriter === 'function') return;
            const sources = [
                'https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.53/dist/zip.min.js',
                'https://unpkg.com/@zip.js/zip.js@2.7.53/dist/zip.min.js'
            ];
            let lastError;
            for (const source of sources) {
                try {
                    await loadScript(source);
                    if (window.zip && typeof window.zip.ZipWriter === 'function') return;
                } catch (error) {
                    lastError = error;
                }
            }
            throw lastError || new Error('ZIP library did not expose ZipWriter');
        }

        function resizeEditor() {
            messageBox.style.height = 'auto';
            messageBox.style.height = `${messageBox.scrollHeight}px`;
        }

        messageBox.addEventListener('input', resizeEditor);
        resizeEditor();

        function showDownload(blob, fileName) {
            if (downloadUrl) URL.revokeObjectURL(downloadUrl);
            downloadUrl = URL.createObjectURL(blob);
            downloadFallback.href = downloadUrl;
            downloadFallback.download = fileName;
            downloadFallback.textContent = `Download ${fileName}`;
            downloadFallback.style.display = 'block';
            setStatus('ZIP created. If it did not download automatically, click the link above.');

            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = fileName;
            link.rel = 'noopener';
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            link.remove();
        }

        function cleanFileName(value) {
            let name = value.trim() || 'document';
            if (/\.zip$/i.test(name)) name = name.slice(0, -4);
            return name.replace(/[\\/:*?"<>|\x00-\x1F]/g, '_').trim() || 'document';
        }

        zipBtn.addEventListener('click', async () => {
            const textContent = messageBox.value;
            const password = passwordInput.value;
            const fileName = `${cleanFileName(fileNameInput.value)}.zip`;

            if (!textContent.trim()) {
                setStatus('Please write some text in the box before zipping.', true);
                messageBox.focus();
                return;
            }
            if (!password) {
                setStatus('Please enter a password to encrypt your file.', true);
                passwordInput.focus();
                return;
            }
            if (!zipReady) {
                setStatus('The ZIP library is not available. Check your connection and reload the page.', true);
                return;
            }

            zipBtn.disabled = true;
            zipBtn.textContent = 'Encrypting...';
            downloadFallback.style.display = 'none';
            setStatus('Creating encrypted ZIP...');

            let zipWriter;
            try {
                zip.configure({ useWebWorkers: false });
                const blobWriter = new zip.BlobWriter('application/zip');
                zipWriter = new zip.ZipWriter(blobWriter);
                await zipWriter.add('document.txt', new zip.TextReader(textContent), {
                    password,
                    zipCrypto: true
                });
                await zipWriter.close();
                zipWriter = null;
                showDownload(await blobWriter.getData(), fileName);
            } catch (error) {
                if (zipWriter) {
                    try { await zipWriter.close(); } catch (_) { /* already failed */ }
                }
                console.error(error);
                setStatus(`Encryption failed: ${error.message || error}`, true);
            } finally {
                zipBtn.disabled = false;
                zipBtn.textContent = 'Zip & Encrypt';
            }
        });

        loadZipLibrary().then(() => {
            zipReady = true;
            zipBtn.disabled = false;
            setStatus('Ready to create an encrypted ZIP.');
        }).catch(error => {
            console.error('ZIP library load failed:', error);
            setStatus('The ZIP library could not be loaded. Check your connection or content blocker and reload the page.', true);
        });
    </script>
</body>
</html>
